name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build WASM, Test & Deploy Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Setup Rust toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build Rust/WASM release artifacts
        run: >
          cargo build --release --target wasm32-unknown-unknown
          -p elf2wasm-compiler-wasm -p elf2wasm-runtime-wasm -p elf2wasm-worker-wasm

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Stage static assets for Cloudflare Workers
        working-directory: worker
        run: node scripts/build_assets.mjs

      - name: Run Web UI URL state unit tests
        run: node --test js/test_url_state.mjs

      - name: Run Node server & proxy tests
        run: node --test server/test_server.mjs

      - name: Run Cloudflare Worker tests
        working-directory: worker
        run: npm test

      - name: Dry-run Wrangler deploy (PR validation)
        if: github.event_name == 'pull_request'
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
