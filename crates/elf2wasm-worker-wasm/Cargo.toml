[package]
name = "elf2wasm-worker-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.21"
elf2wasm-core = { path = "../elf2wasm-core", default-features = false }
elf2wasm-runtime-core = { path = "../elf2wasm-runtime-core", default-features = false }
goblin = { version = "0.9", default-features = false, features = ["elf64", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "2.0", default-features = false, features = [
    "std",
    "simd",
    "validate",
    "auto-dispatch",
    "deterministic",
] }
